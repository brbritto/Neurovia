<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Daily Check-In - Neurovia
  </title>

  <link
    rel="stylesheet"
    href="css/materialdesignicons.min.css"
  >

  <link
    rel="stylesheet"
    href="css/personalizado.css"
  >

</head>


<body>

  <div class="grid-overlay"></div>


  <main class="screen-container">

    <div
      class="hero-card"
      style="max-width:520px;margin:0 auto;"
    >

      <p class="muted">
        DAILY CHECK-IN
      </p>


      <h1 class="section-title">
        How is your brain doing today?
      </h1>


      <p class="section-subtitle">
        A quick check-in helps Neurovia estimate
        cognitive load, recovery, sleep debt and
        Brain Readiness.
      </p>


      <form id="dailyUpdateForm">


        <div class="input-row">

          <label>
            What time did you fall asleep?
          </label>

          <div class="input-box">

            <i class="mdi mdi-weather-night"></i>

            <input
              id="sleepTime"
              type="time"
              required
            >

          </div>

        </div>


        <div class="input-row">

          <label>
            What time did you wake up?
          </label>

          <div class="input-box">

            <i class="mdi mdi-weather-sunset-up"></i>

            <input
              id="wakeTime"
              type="time"
              required
            >

          </div>

        </div>


        <div class="input-row">

          <label>
            How was your sleep quality?
          </label>

          <div class="input-box">

            <i class="mdi mdi-bed-outline"></i>

            <select
              id="sleepQuality"
              required
            >

              <option value="">
                Select 1–10
              </option>

              <option value="1">
                1 — Very poor
              </option>

              <option value="2">2</option>

              <option value="3">3</option>

              <option value="4">4</option>

              <option value="5">
                5 — Average
              </option>

              <option value="6">6</option>

              <option value="7">7</option>

              <option value="8">8</option>

              <option value="9">9</option>

              <option value="10">
                10 — Excellent
              </option>

            </select>

          </div>

        </div>


        <div class="input-row">

          <label>
            How stressed do you feel today?
          </label>

          <div class="input-box">

            <i class="mdi mdi-brain"></i>

            <select
              id="stressLevel"
              required
            >

              <option value="">
                Select 1–10
              </option>

              <option value="1">
                1 — Very low
              </option>

              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>

              <option value="5">
                5 — Moderate
              </option>

              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>

              <option value="10">
                10 — Very high
              </option>

            </select>

          </div>

        </div>


        <div class="input-row">

          <label>
            How is your energy today?
          </label>

          <div class="input-box">

            <i class="mdi mdi-lightning-bolt-outline"></i>

            <select
              id="energyLevel"
              required
            >

              <option value="">
                Select 1–10
              </option>

              <option value="1">
                1 — Exhausted
              </option>

              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>

              <option value="5">
                5 — Moderate
              </option>

              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>

              <option value="10">
                10 — Very energized
              </option>

            </select>

          </div>

        </div>


        <div class="input-row">

          <label>
            How mentally demanding is your day?
          </label>

          <div class="input-box">

            <i class="mdi mdi-chart-timeline-variant"></i>

            <select
              id="workloadLevel"
              required
            >

              <option value="">
                Select 1–10
              </option>

              <option value="1">
                1 — Very light
              </option>

              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>

              <option value="5">
                5 — Moderate
              </option>

              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>

              <option value="10">
                10 — Extremely demanding
              </option>

            </select>

          </div>

        </div>


        <div class="input-row">

          <label>
            How well can you focus today?
          </label>

          <div class="input-box">

            <i class="mdi mdi-crosshairs-gps"></i>

            <select
              id="focusLevel"
              required
            >

              <option value="">
                Select 1–10
              </option>

              <option value="1">
                1 — Cannot focus
              </option>

              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>

              <option value="5">
                5 — Moderate
              </option>

              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>

              <option value="10">
                10 — Very focused
              </option>

            </select>

          </div>

        </div>


        <button
          class="primary-btn"
          type="submit"
        >
          Analyze my day
        </button>


        <button
          class="secondary-btn"
          type="button"
          style="margin-top:10px;"
          onclick="window.location.href='dashboard.html'"
        >
          Back
        </button>


        <p
          id="dailyUpdateMessage"
          class="message-text"
        ></p>

      </form>

    </div>

  </main>


  <script src="js/storage.js"></script>

  <script src="js/scoring.js"></script>

  <script src="js/daily-update.js"></script>

</body>
</html>
