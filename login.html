<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Log In - Neurovia</title>

  <link
    rel="stylesheet"
    href="css/materialdesignicons.min.css"
  >

  <link
    rel="stylesheet"
    href="css/personalizado.css"
  >
</head>

<body>

  <div class="grid-overlay"></div>

  <div class="screen-container">

    <div
      class="hero-card"
      style="max-width:430px;margin:auto;"
    >

      <div class="logo-circle">
        <i class="mdi mdi-brain"></i>
      </div>

      <h1 class="brand-title">
        Neuro<span>via</span>
      </h1>

      <p class="brand-subtitle">
        Welcome back.
      </p>


      <form id="loginForm">

        <div class="input-row">

          <label>Email</label>

          <div class="input-box">

            <i class="mdi mdi-email-outline"></i>

            <input
              id="email"
              type="email"
              required
            >

          </div>

        </div>


        <div class="input-row">

          <label>Password</label>

          <div class="input-box">

            <i class="mdi mdi-lock-outline"></i>

            <input
              id="password"
              type="password"
              required
            >

          </div>

        </div>


        <button
          class="primary-btn"
          type="submit"
        >
          Log In
        </button>

        <p
          id="loginMessage"
          class="message-text"
        ></p>

      </form>


      <button
        id="createAccountBtn"
        class="secondary-btn"
        type="button"
        style="margin-top:12px;"
      >
        Create Account
      </button>


      <button
        id="backHomeBtn"
        class="ghost-btn"
        type="button"
        style="margin-top:10px;"
      >
        Back to Neurovia
      </button>

    </div>

  </div>


  <script src="js/storage.js"></script>

  <script src="js/app-login.js"></script>

  <script>
    document
      .getElementById("backHomeBtn")
      .addEventListener(
        "click",
        function () {
          window.location.href =
            "index.html";
        }
      );
  </script>

</body>
</html>
